name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install CM dependencies
        run: npm install --ignore-scripts
        working-directory: dsne-cm

      - name: Build CM
        run: npm run dist
        working-directory: dsne-cm

      - name: Install HYG dependencies
        run: npm install --ignore-scripts
        working-directory: dsne-hyg

      - name: Build HYG
        run: npm run dist
        working-directory: dsne-hyg

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dsne-cm/dist/*.exe
            dsne-hyg/dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
