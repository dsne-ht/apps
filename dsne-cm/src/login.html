<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>DSNE — Clinique Mobile</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-dsne">DSNE</div>
      <div class="login-appname">Enregistrement Clinique Mobile</div>
    </div>
    <div id="alert" class="alert alert-error" style="display:none"></div>
    <div class="field" style="margin-bottom:12px">
      <label>Nom d'utilisateur</label>
      <input type="text" id="username" placeholder="Votre identifiant" autocomplete="username">
    </div>
    <div class="field" style="margin-bottom:1.25rem">
      <label>Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-full" id="loginBtn" onclick="doLogin()">Se connecter</button>
    <div style="text-align:center;margin-top:0.875rem">
      <span style="font-size:12px;color:var(--g400)">Pas encore de compte ? </span>
      <a href="register.html" style="font-size:12px;color:var(--c600);font-weight:500;text-decoration:none">Créer un compte</a>
    </div>
  </div>
</div>
<script>
async function doLogin() {
  const username = document.getElementById('username').value.trim()
  const password = document.getElementById('password').value.trim()
  const alertEl = document.getElementById('alert')
  const btn = document.getElementById('loginBtn')
  if (!username || !password) { alertEl.textContent = 'Veuillez remplir tous les champs.'; alertEl.style.display = 'block'; return }
  btn.disabled = true; btn.textContent = 'Connexion...'
  const result = await window.dsne.login({ username, password })
  if (result.ok) {
    sessionStorage.setItem('user', JSON.stringify(result.user))
    window.dsne.navigate('index.html')
  } else {
    if (result.pending) window.dsne.navigate('pending.html')
    else { alertEl.textContent = result.message; alertEl.style.display = 'block' }
    btn.disabled = false; btn.textContent = 'Se connecter'
  }
}
document.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin() })
</script>
</body>
</html>
