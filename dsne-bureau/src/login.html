<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Bureau de Direction | DSNE</title>
<link rel="stylesheet" href="styles.css">
  <link href='https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap' rel='stylesheet'>
</head>
<body>
<div class="login-wrap" style="background:#005C4E;min-height:100vh;display:flex;align-items:center;justify-content:center;">
  <div class="login-card" style="background:#fff;padding:2.5rem;width:360px;border-top:4px solid #004038;">
    <div class="login-logo">
      <div class="login-dsne" style="font-family:'Cormorant Garamond',Georgia,serif;font-size:32px;font-weight:700;color:#005C4E;text-align:center;letter-spacing:.05em;">DSNE</div>
      <div class="login-appname" style="font-size:13px;color:#7a9a8a;text-align:center;margin-top:4px;margin-bottom:1.5rem;">Bureau de Direction</div>
    </div>
    <div id="alert" class="alert alert-error" style="display:none"></div>

    <div id="step-code">
      <div class="field" style="margin-bottom:16px">
        <label>Code d'accès</label>
        <input type="password" id="code" placeholder="• • • • • •" maxlength="6"
          style="letter-spacing:0.3em;text-align:center;font-size:1.2rem"
          onkeydown="if(event.key==='Enter') submitCode()">
        <span style="font-size:11px;color:var(--g400)">Saisissez votre code personnel à 6 chiffres.</span>
      </div>
      <button class="btn btn-primary btn-full" onclick="submitCode()" style="background:#005C4E;border-color:#005C4E;color:#fff;width:100%;padding:10px;font-size:13px;font-weight:500;border-radius:0;cursor:pointer;">Continuer</button>
    </div>

    <div id="step-activate" style="display:none">
      <p style="font-size:13px;color:var(--g600);text-align:center;margin-bottom:1rem">
        Bienvenue, <strong id="welcomeName"></strong>. Configurez votre compte.
      </p>
      <div class="field" style="margin-bottom:12px">
        <label>Adresse e-mail</label>
        <input type="email" id="email" placeholder="votre@email.com">
      </div>
      <div class="field" style="margin-bottom:12px">
        <label>Mot de passe</label>
        <input type="password" id="newPassword" placeholder="Choisissez un mot de passe">
      </div>
      <div class="field" style="margin-bottom:16px">
        <label>Confirmer le mot de passe</label>
        <input type="password" id="confirmPassword" placeholder="Répétez le mot de passe"
          onkeydown="if(event.key==='Enter') submitActivate()">
      </div>
      <button class="btn btn-primary btn-full" onclick="submitActivate()" style="background:#005C4E;border-color:#005C4E;color:#fff;width:100%;padding:10px;font-size:13px;font-weight:500;border-radius:0;cursor:pointer;">Activer mon compte</button>
      <button class="btn btn-secondary btn-full" style="margin-top:8px" onclick="resetToCode()">Retour</button>
    </div>

    <div id="step-password" style="display:none">
      <p style="font-size:13px;color:var(--g600);text-align:center;margin-bottom:1rem">
        Bonjour, <strong id="welcomeName2"></strong>.
      </p>
      <div class="field" style="margin-bottom:16px">
        <label>Mot de passe</label>
        <input type="password" id="password" placeholder="Votre mot de passe"
          onkeydown="if(event.key==='Enter') submitLogin()">
      </div>
      <button class="btn btn-primary btn-full" onclick="submitLogin()" style="background:#005C4E;border-color:#005C4E;color:#fff;width:100%;padding:10px;font-size:13px;font-weight:500;border-radius:0;cursor:pointer;">Se connecter</button>
      <button class="btn btn-secondary btn-full" style="margin-top:8px" onclick="resetToCode()">Retour</button>
    </div>
  </div>
</div>
<script>
let currentCode = '';
function showAlert(msg) { const el=document.getElementById('alert'); el.textContent=msg; el.style.display='block'; }
function hideAlert() { document.getElementById('alert').style.display='none'; }
function resetToCode() {
  currentCode=''; hideAlert();
  document.getElementById('code').value='';
  document.getElementById('step-code').style.display='block';
  document.getElementById('step-activate').style.display='none';
  document.getElementById('step-password').style.display='none';
}
async function submitCode() {
  hideAlert();
  const code = document.getElementById('code').value.trim();
  if (!code || code.length !== 6) { showAlert('Veuillez saisir un code à 6 chiffres.'); return; }
  const result = await window.dsne.checkCode({ code });
  if (!result.ok) { showAlert(result.message); return; }
  if (result.autoLogin) {
    sessionStorage.setItem('user', JSON.stringify(result.user));
    window.location.href = 'index.html';
    return;
  }
  currentCode = code;
  document.getElementById('step-code').style.display='none';
  if (!result.activated) {
    document.getElementById('welcomeName').textContent = result.nom_complet;
    document.getElementById('step-activate').style.display='block';
  } else {
    document.getElementById('welcomeName2').textContent = result.nom_complet;
    document.getElementById('step-password').style.display='block';
    setTimeout(() => document.getElementById('password').focus(), 100);
  }
}
async function submitActivate() {
  hideAlert();
  const email=document.getElementById('email').value.trim();
  const pass1=document.getElementById('newPassword').value;
  const pass2=document.getElementById('confirmPassword').value;
  if (!email) { showAlert('Veuillez saisir votre adresse e-mail.'); return; }
  if (!pass1 || pass1.length < 6) { showAlert('Le mot de passe doit contenir au moins 6 caractères.'); return; }
  if (pass1 !== pass2) { showAlert('Les mots de passe ne correspondent pas.'); return; }
  const result = await window.dsne.activate({ code: currentCode, email, password: pass1 });
  if (!result.ok) { showAlert(result.message); return; }
  sessionStorage.setItem('user', JSON.stringify(result.user));
  window.location.href = 'index.html';
}
async function submitLogin() {
  hideAlert();
  const password = document.getElementById('password').value;
  if (!password) { showAlert('Veuillez saisir votre mot de passe.'); return; }
  const result = await window.dsne.login({ code: currentCode, password });
  if (!result.ok) { showAlert(result.message); return; }
  sessionStorage.setItem('user', JSON.stringify(result.user));
  window.location.href = 'index.html';
}
</script>
</body>
</html>
